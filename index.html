<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VIP Access Terminal</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root { --theme-color: #00f2fe; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace, 'Segoe UI'; user-select: none; }
    body { background: #030408; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; position: relative; }
    #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    #forceUpdateOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(3, 4, 8, 0.95); backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px); display: none;
      justify-content: center; align-items: center; z-index: 9999999;
    }
    .update-card-box {
      width: 86%; max-width: 325px; background: rgba(255, 0, 59, 0.04);
      border: 1.8px solid #ff003b; box-shadow: 0 0 50px rgba(255, 0, 59, 0.5), inset 0 0 15px rgba(255, 0, 59, 0.3);
      border-radius: 20px; padding: 28px 22px; text-align: center;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .update-badge {
      display: inline-block; padding: 4px 12px; font-size: 10px; font-weight: 800; letter-spacing: 2px;
      color: #ff003b; border: 1px solid #ff003b; border-radius: 20px; margin-bottom: 14px;
    }
    .update-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 12px; text-shadow: 0 0 10px #ff003b; }
    .version-tag { font-size: 12px; color: #8fa0bd; margin-bottom: 15px; }
    .version-tag span { color: var(--theme-color); font-weight: bold; }
    .update-desc { font-size: 13.5px; color: #cfddec; margin-bottom: 24px; line-height: 1.5; }
    .btn-update {
      width: 100%; padding: 13px 0; background: #ff003b; color: #fff; border: none;
      border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 14px;
      letter-spacing: 1.5px; box-shadow: 0 0 25px rgba(255, 0, 59, 0.7);
    }

    .popup-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(3, 4, 8, 0.88); backdrop-filter: blur(15px);
      display: none; justify-content: center; align-items: center; z-index: 10000;
    }
    .popup-box {
      width: 86%; max-width: 320px; background: rgba(13, 19, 34, 0.85);
      border: 1.5px solid var(--theme-color); box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), inset 0 0 15px var(--theme-color);
      border-radius: 18px; padding: 24px 20px; text-align: center;
    }
    .modal-title { font-size: 16px; font-weight: 800; color: var(--theme-color); margin-bottom: 10px; }
    .modal-desc { font-size: 13px; color: #cfddec; margin-bottom: 20px; line-height: 1.5; }
    .modal-btn {
      width: 100%; padding: 11px 0; background: var(--theme-color); color: #030408;
      border: none; border-radius: 8px; font-weight: 800; cursor: pointer; box-shadow: 0 0 15px var(--theme-color);
    }

    .login-card {
      position: relative; z-index: 2; width: 88%; max-width: 335px; padding: 26px 20px;
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px); border-radius: 20px; border: 1.5px solid var(--theme-color);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), inset 0 0 15px var(--theme-color);
      text-align: center; transition: all 0.4s ease;
    }
    .shake-error {
      animation: brutalShake 0.38s cubic-bezier(.36,.07,.19,.97) both;
      border-color: #ff003b !important; box-shadow: 0 0 40px rgba(255, 0, 59, 0.8) !important;
    }
    @keyframes brutalShake {
      10%, 90% { transform: translate3d(-5px, 0, 0) rotate(-1.5deg); }
      20%, 80% { transform: translate3d(6px, 0, 0) rotate(1.5deg); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0) rotate(-2deg); }
      40%, 60% { transform: translate3d(8px, 0, 0) rotate(2deg); }
    }
    .badge {
      display: inline-block; padding: 4px 12px; font-size: 9.5px; font-weight: 800;
      letter-spacing: 2.5px; text-transform: uppercase; background: transparent;
      color: var(--theme-color); border-radius: 20px; border: 1px solid var(--theme-color);
      margin-bottom: 12px; text-shadow: 0 0 8px var(--theme-color);
    }
    h2 { font-size: 20px; font-weight: 800; letter-spacing: 2px; margin-bottom: 18px; color: #fff; text-shadow: 0 0 12px var(--theme-color); }
    .input-box {
      width: 100%; padding: 12px 14px; background: rgba(0, 0, 0, 0.55);
      border: 1.2px solid rgba(255, 255, 255, 0.18); border-radius: 10px;
      color: #fff; font-size: 13.5px; font-weight: 600; letter-spacing: 1.5px;
      text-align: center; outline: none; margin-bottom: 16px;
    }
    .input-box:focus { border-color: var(--theme-color); box-shadow: 0 0 12px var(--theme-color); }

    .btn-login {
      width: 100%; padding: 13px 0; background: transparent; border: 1.5px solid var(--theme-color);
      border-radius: 10px; color: var(--theme-color); font-size: 13.5px; font-weight: 800;
      letter-spacing: 2px; cursor: pointer; box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }
    .btn-login:hover { background: var(--theme-color); color: #030408; box-shadow: 0 0 25px var(--theme-color); }
    
    .btn-launch {
      width: 100%; padding: 13px 0; margin-top: 15px;
      background: var(--theme-color); color: #030408; border: none;
      border-radius: 10px; font-size: 13px; font-weight: 900;
      letter-spacing: 1.5px; cursor: pointer; box-shadow: 0 0 22px var(--theme-color);
      transition: transform 0.2s ease;
    }
    .btn-launch:active { transform: scale(0.96); }

    .btn-switch-key {
      background: transparent; border: none; color: #8fa0bd; font-size: 11px;
      margin-top: 12px; cursor: pointer; text-decoration: underline; display: inline-block;
    }

    #msg { margin-top: 14px; font-size: 11.5px; font-weight: 700; min-height: 16px; }
    .err { color: #ff003b; }
    .suc { color: var(--theme-color); }

    .details-box {
      display: none; text-align: left; background: rgba(0, 10, 5, 0.7);
      border: 1px dashed var(--theme-color); border-radius: 12px;
      padding: 14px; margin-top: 15px; font-size: 11.5px; line-height: 1.6;
    }
    .details-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .details-label { color: #8fa0bd; font-weight: 600; }
    .details-val { color: var(--theme-color); font-weight: bold; }
    .countdown-timer {
      text-align: center; margin-top: 10px; padding: 8px; border-radius: 8px;
      background: rgba(0, 0, 0, 0.45); border: 1px solid var(--theme-color);
      color: var(--theme-color); font-weight: 800; font-size: 12px;
    }
  </style>
</head>
<body>

  <div id="forceUpdateOverlay">
    <div class="update-card-box">
      <div class="update-badge">MANDATORY UPDATE</div>
      <div class="update-title">UPDATE REQUIRED</div>
      <div class="version-tag">Installed: <span id="curVerTag">1.0</span> | Latest: <span id="latVerTag">1.1</span></div>
      <div class="update-desc" id="updateChangelog">A mandatory update is required. Please update to continue.</div>
      <button class="btn-update" onclick="proceedAppUpdate()">DOWNLOAD UPDATE</button>
    </div>
  </div>

  <div class="popup-modal-overlay" id="noticeModal">
    <div class="popup-box">
      <div class="modal-title">📢 ANNOUNCEMENT</div>
      <div class="modal-desc" id="popupNoticeText">Notice message</div>
      <button class="modal-btn" onclick="dismissNotice()">DISMISS</button>
    </div>
  </div>

  <canvas id="bg-canvas"></canvas>

  <div class="login-card" id="card">
    <div class="badge">SECURE TERMINAL</div>
    <h2>VIP ACCESS</h2>

    <div id="loginFormArea">
      <input type="text" id="licenseKey" class="input-box" placeholder="ENTER ACCESS KEY..." autocomplete="off" />
      <button class="btn-login" id="loginBtn" onclick="verifyKeyManually()">AUTHENTICATE</button>
    </div>

    <div class="details-box" id="detailsBox">
      <div class="details-row"><span class="details-label">Key:</span><span class="details-val" id="dKey">-</span></div>
      <div class="details-row"><span class="details-label">Mode:</span><span class="details-val" id="dDevices">-</span></div>
      <div class="details-row"><span class="details-label">HWID:</span><span class="details-val" id="dHwid" style="font-size:10px;">-</span></div>
      <div class="countdown-timer" id="dCountdown">CALCULATING TIME...</div>
      
      <!-- ইউজার এখানে ক্লিক করলেই Android Interface কল হবে -->
      <button class="btn-launch" id="launchBtn" onclick="launchWindow()">⚡ START / OPEN WINDOW</button>
      <div style="text-align:center;">
        <button class="btn-switch-key" onclick="resetLogin()">Switch / Change Key</button>
      </div>
    </div>

    <div id="msg"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAOnukvUIXpnsBqxg6p__73SH_j9z6_XwM",
      authDomain: "trial-3d140.firebaseapp.com",
      databaseURL: "https://trial-3d140-default-rtdb.firebaseio.com",
      projectId: "trial-3d140",
      storageBucket: "trial-3d140.firebasestorage.app",
      messagingSenderId: "849558578206",
      appId: "1:849558578206:android:9bc880cc645505a2afba0f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let localKeys = {};
    let isKeysLoaded = false;
    let targetDownloadUrl = "";
    let isSystemLockedByUpdate = false;

    function getInstalledAppVersion() {
      try {
        if (typeof Android !== "undefined" && Android.getAppVersionName) {
          const v = Android.getAppVersionName();
          if (v && v.trim() !== "") return v.trim();
        }
      } catch (e) {}
      return "1.0";
    }

    function isNewerVersion(serverVer, localVer) {
      const v1 = serverVer.toString().split('.').map(Number);
      const v2 = localVer.toString().split('.').map(Number);
      const len = Math.max(v1.length, v2.length);
      for (let i = 0; i < len; i++) {
        const num1 = v1[i] || 0;
        const num2 = v2[i] || 0;
        if (num1 > num2) return true;
        if (num1 < num2) return false;
      }
      return false;
    }

    db.ref("Settings/appUpdate").on("value", snap => {
      const overlay = document.getElementById("forceUpdateOverlay");
      const card = document.getElementById("card");

      if (snap.exists() && snap.val().latestVersion) {
        const data = snap.val();
        const serverVersion = data.latestVersion.toString().trim();
        const currentVersion = getInstalledAppVersion();

        document.getElementById("curVerTag").innerText = currentVersion;
        document.getElementById("latVerTag").innerText = serverVersion;

        if (isNewerVersion(serverVersion, currentVersion)) {
          isSystemLockedByUpdate = true;
          targetDownloadUrl = data.downloadUrl || "";
          document.getElementById("updateChangelog").innerText = data.updateMessage || "Please update to continue.";
          card.style.display = "none";
          overlay.style.display = "flex";
          return;
        }
      }

      isSystemLockedByUpdate = false;
      overlay.style.display = "none";
      card.style.display = "block";
      populateSavedKey();
    });

    function proceedAppUpdate() {
      if (targetDownloadUrl) {
        if (typeof Android !== "undefined" && Android.openBrowser) {
          Android.openBrowser(targetDownloadUrl);
        } else {
          window.open(targetDownloadUrl, "_blank");
        }
      }
    }

    db.ref("Notifications/mainPanel").on("value", snap => {
      const modal = document.getElementById("noticeModal");
      const txt = document.getElementById("popupNoticeText");
      if (snap.exists() && snap.val() && snap.val().trim() !== "") {
        const msg = snap.val().trim();
        if (localStorage.getItem("lastDismissedNotice") !== msg) {
          txt.innerText = msg;
          modal.style.display = "flex";
        }
      } else {
        modal.style.display = "none";
      }
    });

    function dismissNotice() {
      localStorage.setItem("lastDismissedNotice", document.getElementById("popupNoticeText").innerText);
      document.getElementById("noticeModal").style.display = "none";
    }

    db.ref("Keys").on("value", snap => {
      localKeys = snap.exists() ? snap.val() : {};
      isKeysLoaded = true;
      if (!isSystemLockedByUpdate) populateSavedKey();
    });

    // ক্যানভাস ব্যাকগ্রাউন্ড অ্যানিমেশন
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let items = [];
    let fx = { mode: "bg_1", color: "#00f2fe", count: 65, speed: 1.0 };

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    db.ref("Settings/particles").on("value", snap => {
      if (snap.exists()) {
        fx = Object.assign(fx, snap.val());
        document.documentElement.style.setProperty('--theme-color', fx.color || "#00f2fe");
        buildFx();
      }
    });

    function buildFx() {
      items = [];
      for (let i = 0; i < (fx.count || 65); i++) {
        items.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2.5 + 1,
          speedX: (Math.random() - 0.5) * (fx.speed || 1),
          speedY: (Math.random() - 0.5) * (fx.speed || 1),
          char: String.fromCharCode(0x30A0 + Math.random() * 96)
        });
      }
    }
    buildFx();

    function renderEngine() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = fx.color || "#00f2fe";
      ctx.strokeStyle = fx.color || "#00f2fe";

      const bgNum = parseInt((fx.mode || "bg_1").replace("bg_", "")) || 1;
      if (bgNum <= 20) {
        ctx.font = "14px monospace";
        items.forEach(p => {
          ctx.fillText(p.char, p.x, p.y);
          p.y += (fx.speed * 2.5);
          if (p.y > canvas.height) { p.y = 0; p.x = Math.random() * canvas.width; }
        });
      } else {
        for (let i = 0; i < items.length; i++) {
          let p = items[i];
          p.x += p.speedX; p.y += p.speedY;
          if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
          if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();

          for (let j = i + 1; j < items.length; j++) {
            let p2 = items[j];
            let d = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (d < 85) {
              ctx.globalAlpha = 1 - (d / 85);
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
              ctx.globalAlpha = 1;
            }
          }
        }
      }
      requestAnimationFrame(renderEngine);
    }
    renderEngine();

    function getDeviceId() { return (typeof Android !== "undefined" && Android.getDeviceId) ? Android.getDeviceId() : "WEB_" + window.navigator.userAgent.slice(0, 8); }
    function getDeviceModel() { return (typeof Android !== "undefined" && Android.getDeviceModel) ? Android.getDeviceModel() : "Android Mobile"; }

    function triggerFail(txt) {
      const card = document.getElementById("card");
      const msg = document.getElementById("msg");
      msg.className = "err"; msg.innerText = txt;
      card.classList.remove("shake-error");
      void card.offsetWidth;
      card.classList.add("shake-error");
      setTimeout(() => card.classList.remove("shake-error"), 380);
    }

    let timerInterval = null;
    function startLiveCountdown(expiryTime, isUnlimited) {
      const display = document.getElementById("dCountdown");
      if (timerInterval) clearInterval(timerInterval);

      if (isUnlimited) {
        display.innerText = "EXPIRATION: LIFETIME UNLIMITED";
        return;
      }

      function update() {
        const diff = expiryTime - Date.now();
        if (diff <= 0) {
          display.innerText = "KEY HAS EXPIRED!";
          display.style.color = "#ff003b";
          clearInterval(timerInterval);
          resetLogin();
          return;
        }
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        display.innerText = `EXPIRES IN: ${d}d ${h}h ${m}m ${s}s`;
      }
      update();
      timerInterval = setInterval(update, 1000);
    }

    // অটো-লগইন বন্ধ: সেভ থাকা কি থাকলে শুধু বক্সে বসবে, ফাংশন রান হবে না
    function populateSavedKey() {
      const savedKey = localStorage.getItem("savedVipKey");
      if (savedKey) {
        document.getElementById("licenseKey").value = savedKey;
      }
    }

    // অথেনটিকেশন বাটন চাপলে ভেরিফাই হবে
    function verifyKeyManually() {
      if (isSystemLockedByUpdate) return alert("Update required to proceed!");

      const key = document.getElementById("licenseKey").value.trim();
      const msg = document.getElementById("msg");
      if (!key) return triggerFail("ACCESS DENIED: KEY MISSING");

      const data = localKeys[key];
      if (!data) { resetLogin(); return triggerFail("INVALID KEY: REJECTED"); }
      if (data.status === "banned") { resetLogin(); return triggerFail("FATAL: ACCESS BANNED"); }
      if (data.status === "frozen") return triggerFail("WARNING: KEY IS FROZEN");

      const devId = getDeviceId();
      const devModel = getDeviceModel();
      const now = Date.now();

      if (!data.isUnlimited) {
        if (data.registeredDeviceId && data.registeredDeviceId !== "" && data.registeredDeviceId !== devId) {
          resetLogin();
          return triggerFail("HWID LOCK: OTHER DEVICE DETECTED");
        }
        if (data.registeredDeviceId && data.expiryTime && now > data.expiryTime) {
          resetLogin();
          return triggerFail("SESSION EXPIRED: KEY EXPIRED");
        }
      }

      localStorage.setItem("savedVipKey", key);

      document.getElementById("dKey").innerText = key;
      document.getElementById("dDevices").innerText = data.isUnlimited ? "Unlimited Devices" : "Single Device Only";
      document.getElementById("dHwid").innerText = devId;

      document.getElementById("detailsBox").style.display = "block";
      document.getElementById("loginFormArea").style.display = "none";

      msg.className = "suc";
      msg.innerText = "AUTHENTICATED! CLICK BELOW TO START";

      let finalExpiry = data.expiryTime || 0;
      if (!data.isUnlimited && (!data.registeredDeviceId || data.registeredDeviceId === "")) {
        let mult = 60000;
        if (data.durationType === "days") mult *= 1440;
        else if (data.durationType === "months") mult *= 1440 * 30;
        else if (data.durationType === "years") mult *= 1440 * 365;
        finalExpiry = now + ((parseInt(data.durationValue) || 1) * mult);

        db.ref("Keys/" + key).update({
          registeredDeviceId: devId,
          deviceModel: devModel,
          firstLoginTime: now,
          expiryTime: finalExpiry
        });
      } else if (data.isUnlimited) {
        const cleanDevKey = devId.replace(/[^a-zA-Z0-9_-]/g, "_");
        db.ref(`Keys/${key}/loggedDevices/${cleanDevKey}`).set({
          deviceModel: devModel,
          hwid: devId,
          loginTime: now,
          loginDate: new Date(now).toLocaleString()
        });
      }

      startLiveCountdown(finalExpiry, data.isUnlimited);
    }

    // বাটন ক্লিকে উইন্ডো ওপেন করার জন্য Android কল
    function launchWindow() {
      const msg = document.getElementById("msg");
      if (typeof Android !== "undefined" && Android.onLoginSuccess) {
        msg.className = "suc";
        msg.innerText = "INITIALIZING PERMISSIONS & WINDOW...";
        Android.onLoginSuccess();
      } else {
        msg.className = "err";
        msg.innerText = "ERROR: ANDROID INTERFACE NOT FOUND";
        alert("Native Android Interface not found! Please open inside the App.");
      }
    }

    function resetLogin() {
      localStorage.removeItem("savedVipKey");
      document.getElementById("licenseKey").value = "";
      document.getElementById("detailsBox").style.display = "none";
      document.getElementById("loginFormArea").style.display = "block";
      document.getElementById("msg").innerText = "";
      if (timerInterval) clearInterval(timerInterval);
    }
  </script>
</body>
</html>
