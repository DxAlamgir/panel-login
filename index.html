<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Access Terminal</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root { --theme-color: #00f2fe; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Rajdhani', sans-serif; user-select: none; }
    body { background: #030408; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; position: relative; }
    #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    .popup-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(3, 4, 8, 0.88); backdrop-filter: blur(15px);
      display: none; justify-content: center; align-items: center; z-index: 10000;
    }
    .popup-box {
      width: 88%; max-width: 320px; background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid var(--theme-color); box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), inset 0 0 15px var(--theme-color);
      border-radius: 18px; padding: 24px 20px; text-align: center;
    }
    .modal-title { font-size: 16px; font-weight: 800; color: var(--theme-color); margin-bottom: 10px; }
    .modal-desc { font-size: 13px; color: #cfddec; margin-bottom: 20px; line-height: 1.5; }
    .modal-btn {
      width: 100%; padding: 11px 0; background: var(--theme-color); color: #030408;
      border: none; border-radius: 8px; font-weight: 800; cursor: pointer; box-shadow: 0 0 15px var(--theme-color);
    }

    .login-card {
      position: relative; z-index: 2; width: 86%; max-width: 325px; padding: 26px 20px;
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px);
      border-radius: 20px; border: 1.5px solid var(--theme-color);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), inset 0 0 15px var(--theme-color);
      text-align: center; transition: all 0.4s ease;
    }
    .shake-error { animation: shake 0.38s ease; border-color: #ff003b !important; box-shadow: 0 0 40px rgba(255, 0, 59, 0.8) !important; }
    @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

    .badge {
      display: inline-block; padding: 4px 12px; font-size: 9.5px; font-weight: 800;
      letter-spacing: 2.5px; text-transform: uppercase; background: transparent;
      color: var(--theme-color); border-radius: 20px; border: 1px solid var(--theme-color); margin-bottom: 12px;
    }
    h2 { font-size: 20px; font-weight: 800; letter-spacing: 2px; margin-bottom: 18px; color: #fff; text-shadow: 0 0 12px var(--theme-color); }
    .input-box {
      width: 100%; padding: 12px 14px; background: rgba(0, 0, 0, 0.45);
      border: 1.2px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #fff;
      font-size: 14px; font-weight: 600; text-align: center; outline: none; margin-bottom: 16px;
    }
    .input-box:focus { border-color: var(--theme-color); box-shadow: 0 0 14px var(--theme-color); }
    .btn-login {
      width: 100%; padding: 13px 0; background: transparent; border: 1.5px solid var(--theme-color);
      border-radius: 10px; color: var(--theme-color); font-size: 13.5px; font-weight: 800;
      cursor: pointer; transition: 0.3s;
    }
    .btn-login:hover { background: var(--theme-color); color: #030408; box-shadow: 0 0 25px var(--theme-color); }
    #msg { margin-top: 14px; font-size: 11.5px; font-weight: 700; min-height: 16px; }
    .err { color: #ff003b; }
    .suc { color: var(--theme-color); }

    .details-box {
      display: none; text-align: left; background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--theme-color); border-radius: 12px; padding: 15px; margin-top: 15px; font-size: 12px;
    }
    .details-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .details-label { color: #8fa0bd; font-weight: 600; }
    .details-val { color: var(--theme-color); font-weight: bold; }
    .countdown-timer {
      text-align: center; margin-top: 12px; padding: 8px; border-radius: 8px;
      background: rgba(0, 0, 0, 0.35); border: 1px dashed var(--theme-color);
      color: var(--theme-color); font-weight: 800; font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="popup-modal-overlay" id="noticeModal">
    <div class="popup-box">
      <div class="modal-title">📢 ANNOUNCEMENT</div>
      <div class="modal-desc" id="popupNoticeText">Server announcement</div>
      <button class="modal-btn" onclick="dismissNotice()">DISMISS</button>
    </div>
  </div>

  <div class="popup-modal-overlay" id="updateModal">
    <div class="popup-box">
      <div class="modal-title" style="color:#ff003b;">🚀 UPDATE REQUIRED</div>
      <div class="modal-desc" id="popupUpdateText">Please update the application to proceed.</div>
      <button class="modal-btn" onclick="redirectDownload()">UPDATE NOW</button>
    </div>
  </div>

  <canvas id="bg-canvas"></canvas>

  <div class="login-card" id="card">
    <div class="badge">SECURE ACCESS</div>
    <h2>VIP ACCESS</h2>

    <div id="loginFormArea">
      <input type="text" id="licenseKey" class="input-box" placeholder="XXXX-XXXX-XXXX" autocomplete="off" />
      <button class="btn-login" onclick="verifyFast()">AUTHENTICATE</button>
    </div>

    <!-- তথ্য উইন্ডো (Admin / Issued By সম্পূর্ণ মুছে দেওয়া হয়েছে) -->
    <div class="details-box" id="detailsBox">
      <div class="details-row"><span class="details-label">Key:</span><span class="details-val" id="dKey">-</span></div>
      <div class="details-row"><span class="details-label">License Mode:</span><span class="details-val" id="dDevices">-</span></div>
      <div class="details-row"><span class="details-label">HWID:</span><span class="details-val" id="dHwid" style="font-size:10px;">-</span></div>
      <div class="countdown-timer" id="dCountdown">CALCULATING TIME...</div>
    </div>

    <div id="msg"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAOnukvUIXpnsBqxg6p__73SH_j9z6_XwM",
      authDomain: "trial-3d140.firebaseapp.com",
      databaseURL: "https://trial-3d140-default-rtdb.firebaseio.com",
      projectId: "trial-3d140",
      storageBucket: "trial-3d140.firebasestorage.app",
      messagingSenderId: "849558578206",
      appId: "1:849558578206:android:9bc880cc645505a2afba0f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let localKeys = {};
    let isKeysLoaded = false;
    let downloadTargetUrl = "";

    function getAppVersion() {
      return (typeof Android !== "undefined" && Android.getAppVersionCode) ? parseInt(Android.getAppVersionCode()) : 1;
    }

    db.ref("Keys").on("value", snap => {
      localKeys = snap.exists() ? snap.val() : {};
      isKeysLoaded = true;
      checkSavedKey();
    });

    db.ref("Notifications/mainPanel").on("value", snap => {
      const modal = document.getElementById("noticeModal");
      const txt = document.getElementById("popupNoticeText");
      if (snap.exists() && snap.val().trim() !== "") {
        const msg = snap.val().trim();
        if (sessionStorage.getItem("lastDismissedNotice") !== msg) {
          txt.innerText = msg;
          modal.style.display = "flex";
        }
      } else {
        modal.style.display = "none";
      }
    });

    function dismissNotice() {
      sessionStorage.setItem("lastDismissedNotice", document.getElementById("popupNoticeText").innerText);
      document.getElementById("noticeModal").style.display = "none";
    }

    db.ref("Settings/appUpdate").on("value", snap => {
      const modal = document.getElementById("updateModal");
      if (snap.exists()) {
        const data = snap.val();
        if ((parseInt(data.latestVersion) || 1) > getAppVersion()) {
          downloadTargetUrl = data.downloadUrl || "";
          document.getElementById("popupUpdateText").innerText = data.updateMessage || "Mandatory update required!";
          modal.style.display = "flex";
        } else {
          modal.style.display = "none";
        }
      }
    });

    function redirectDownload() {
      if (downloadTargetUrl) window.open(downloadTargetUrl, "_blank");
    }

    // ব্যাকগ্রাউন্ড থিম ইঞ্জিন
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let items = [];
    let fx = { mode: "bg_1", color: "#00f2fe", count: 65, speed: 1.0 };

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    db.ref("Settings/particles").on("value", snap => {
      if (snap.exists()) {
        fx = Object.assign(fx, snap.val());
        document.documentElement.style.setProperty('--theme-color', fx.color || "#00f2fe");
        buildFx();
      }
    });

    function buildFx() {
      items = [];
      for (let i = 0; i < (fx.count || 65); i++) {
        items.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2.5 + 1,
          speedX: (Math.random() - 0.5) * (fx.speed || 1),
          speedY: (Math.random() - 0.5) * (fx.speed || 1),
          char: String.fromCharCode(0x30A0 + Math.random() * 96)
        });
      }
    }
    buildFx();

    function renderEngine() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = fx.color || "#00f2fe";
      ctx.strokeStyle = fx.color || "#00f2fe";

      const bgNum = parseInt((fx.mode || "bg_1").replace("bg_", "")) || 1;
      if (bgNum <= 20) {
        ctx.font = "14px monospace";
        items.forEach(p => {
          ctx.fillText(p.char, p.x, p.y);
          p.y += (fx.speed * 2.5);
          if (p.y > canvas.height) { p.y = 0; p.x = Math.random() * canvas.width; }
        });
      } else {
        for (let i = 0; i < items.length; i++) {
          let p = items[i];
          p.x += p.speedX; p.y += p.speedY;
          if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
          if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();

          for (let j = i + 1; j < items.length; j++) {
            let p2 = items[j];
            let d = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (d < 85) {
              ctx.globalAlpha = 1 - (d / 85);
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
              ctx.globalAlpha = 1;
            }
          }
        }
      }
      requestAnimationFrame(renderEngine);
    }
    renderEngine();

    function getDeviceId() { 
      return (typeof Android !== "undefined" && Android.getDeviceId) ? Android.getDeviceId() : "WEB_" + window.navigator.userAgent.slice(0, 8); 
    }
    function getDeviceModel() { 
      return (typeof Android !== "undefined" && Android.getDeviceModel) ? Android.getDeviceModel() : "Android Mobile"; 
    }

    function triggerFail(txt) {
      const card = document.getElementById("card");
      const msg = document.getElementById("msg");
      msg.className = "err"; msg.innerText = txt;
      card.classList.remove("shake-error");
      void card.offsetWidth;
      card.classList.add("shake-error");
      setTimeout(() => card.classList.remove("shake-error"), 380);
    }

    let timerInterval = null;
    function startLiveCountdown(expiryTime, isUnlimited) {
      const display = document.getElementById("dCountdown");
      if (timerInterval) clearInterval(timerInterval);

      if (isUnlimited) {
        display.innerText = "EXPIRATION: LIFETIME UNLIMITED";
        return;
      }

      function update() {
        const diff = expiryTime - Date.now();
        if (diff <= 0) {
          display.innerText = "KEY HAS EXPIRED!";
          display.style.color = "#ff003b";
          clearInterval(timerInterval);
          localStorage.removeItem("savedVipKey");
          return;
        }
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        display.innerText = `EXPIRES IN: ${d}d ${h}h ${m}m ${s}s`;
      }
      update();
      timerInterval = setInterval(update, 1000);
    }

    let autoLoginDone = false;
    function checkSavedKey() {
      if (autoLoginDone || !isKeysLoaded) return;
      const savedKey = localStorage.getItem("savedVipKey");
      if (savedKey && localKeys[savedKey]) {
        document.getElementById("licenseKey").value = savedKey;
        autoLoginDone = true;
        verifyFast(true);
      }
    }

    function verifyFast(isAuto = false) {
      const key = document.getElementById("licenseKey").value.trim();
      const msg = document.getElementById("msg");
      if (!key) return triggerFail("ACCESS DENIED: KEY MISSING");

      const data = localKeys[key];
      if (!data) { localStorage.removeItem("savedVipKey"); return triggerFail("INVALID KEY: REJECTED"); }
      if (data.status === "banned") { localStorage.removeItem("savedVipKey"); return triggerFail("FATAL: ACCESS BANNED"); }
      if (data.status === "frozen") return triggerFail("WARNING: KEY IS FROZEN");

      const devId = getDeviceId();
      const devModel = getDeviceModel();
      const now = Date.now();

      if (!data.isUnlimited) {
        if (data.registeredDeviceId && data.registeredDeviceId !== "" && data.registeredDeviceId !== devId) {
          localStorage.removeItem("savedVipKey");
          return triggerFail("HWID LOCK: OTHER DEVICE DETECTED");
        }
        if (data.registeredDeviceId && data.expiryTime && now > data.expiryTime) {
          localStorage.removeItem("savedVipKey");
          return triggerFail("SESSION EXPIRED: KEY EXPIRED");
        }
      }

      localStorage.setItem("savedVipKey", key);

      document.getElementById("dKey").innerText = key;
      document.getElementById("dDevices").innerText = data.isUnlimited ? "Unlimited Devices" : "Single Device Only";
      document.getElementById("dHwid").innerText = devId;

      document.getElementById("detailsBox").style.display = "block";
      document.getElementById("loginFormArea").style.display = "none";

      msg.className = "suc";
      msg.innerText = isAuto ? "WELCOME BACK! LAUNCHING..." : "ACCESS GRANTED! REDIRECTING...";

      let finalExpiry = data.expiryTime || 0;
      if (!data.isUnlimited && (!data.registeredDeviceId || data.registeredDeviceId === "")) {
        let mult = 60000;
        if (data.durationType === "days") mult *= 1440;
        else if (data.durationType === "months") mult *= 1440 * 30;
        else if (data.durationType === "years") mult *= 1440 * 365;
        finalExpiry = now + ((parseInt(data.durationValue) || 1) * mult);

        db.ref("Keys/" + key).update({
          registeredDeviceId: devId,
          deviceModel: devModel,
          firstLoginTime: now,
          expiryTime: finalExpiry
        });
      }

      startLiveCountdown(finalExpiry, data.isUnlimited);

      setTimeout(() => {
        if (typeof Android !== "undefined" && Android.onLoginSuccess) {
          Android.onLoginSuccess();
        }
      }, isAuto ? 800 : 1400);
    }
  </script>
</body>
</html>
